[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "papers-with-pages-app"
version = "0.1.0a1"
description = "A local gallery for paper resources."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "papers-with-pages[render]>=0.1.0a1",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "filelock>=3.18,<4",
    "psutil>=5.9,<8",
    "keyring>=25.6,<26",
]

[project.scripts]
pwp-app = "app.__main__:main"

[tool.uv.sources]
papers-with-pages = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/app"]
